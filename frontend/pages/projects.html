<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Mes Projets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">TaskFlow</h1>
      <div class="flex items-center gap-4">
        <span id="userName" class="font-medium text-gray-700"></span>
        <button onclick="logout()" 
                class="px-5 py-2.5 bg-red-100 hover:bg-red-200 text-red-700 rounded-2xl font-medium transition-all">
          Déconnexion
        </button>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-10">
    <div class="flex justify-between items-center mb-10">
      <h2 class="text-4xl font-semibold text-gray-800">Mes Projets</h2>
      <button onclick="toggleCreateForm()" 
              class="btn flex items-center gap-3 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3.5 rounded-2xl font-semibold shadow-lg">
        <i class="fas fa-plus"></i> 
        Nouveau Projet
      </button>
    </div>

    <!-- Create Project Form -->
    <form id="createProjectForm" class="hidden bg-white p-8 rounded-3xl shadow-xl mb-12">
      <h3 class="text-2xl font-semibold mb-6">Créer un nouveau projet</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium mb-2">Titre du projet</label>
          <input type="text" id="title" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-blue-500" required>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Date limite</label>
          <input type="date" id="dueDate" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-blue-500">
        </div>
      </div>
      <div class="mt-6">
        <label class="block text-sm font-medium mb-2">Description</label>
        <textarea id="description" rows="4" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-blue-500" placeholder="Décrivez le projet..."></textarea>
      </div>
      <div class="flex gap-4 mt-8">
        <button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-semibold">Créer le Projet</button>
        <button type="button" onclick="toggleCreateForm()" class="flex-1 bg-gray-200 hover:bg-gray-300 py-4 rounded-2xl font-semibold">Annuler</button>
      </div>
    </form>

    <!-- Projects Grid -->
    <div id="projectsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/projects.js"></script>
</body>
</html>
