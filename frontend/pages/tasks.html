<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Tâches</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .task-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .task-card:hover { transform: translateY(-6px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow-sm border-b sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-8">
      <h1 onclick="window.location.href='dashboard.html'" 
          class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent cursor-pointer hover:opacity-80">
        TaskFlow
      </h1>
      
      <nav class="flex gap-6 text-sm font-medium">
        <a href="dashboard.html" class="nav-link text-gray-700 hover:text-blue-600">Dashboard</a>
        <a href="projects.html" class="nav-link text-gray-700 hover:text-blue-600">Projets</a>
        <a href="tasks.html?projectId=YOUR_PROJECT_ID_HERE" class="nav-link text-gray-700 hover:text-blue-600">Tâches</a>
      </nav>
    </div>

    <div class="flex items-center gap-4">
      <span id="userName" class="font-medium text-gray-700"></span>
      <button onclick="logout()" 
              class="px-5 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-2xl font-medium transition">
        Déconnexion
      </button>
    </div>
  </div>
</header>

  <div class="max-w-7xl mx-auto px-6 py-8">
    <h2 class="text-3xl font-semibold mb-2" id="projectTitle">Chargement du projet...</h2>
    <a href="projects.html" class="text-blue-600 hover:underline flex items-center gap-2 mb-8">
      ← Retour aux projets
    </a>

    <!-- Filters -->
    <div class="bg-white p-6 rounded-3xl shadow mb-8 flex flex-wrap gap-4 items-center">
      <input type="text" id="searchInput" placeholder="Rechercher une tâche..." 
             class="flex-1 px-5 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-blue-500" 
             onkeyup="if(event.key === 'Enter') applyFilters()">
      
      <select id="statusFilter" onchange="applyFilters()" class="px-5 py-3 border border-gray-300 rounded-2xl">
        <option value="">Tous les statuts</option>
        <option value="à faire">À faire</option>
        <option value="en cours">En cours</option>
        <option value="terminé">Terminé</option>
      </select>

      <select id="priorityFilter" onchange="applyFilters()" class="px-5 py-3 border border-gray-300 rounded-2xl">
        <option value="">Toutes priorités</option>
        <option value="haute">Haute</option>
        <option value="moyenne">Moyenne</option>
        <option value="basse">Basse</option>
      </select>

      <button onclick="applyFilters()" class="btn bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl">Filtrer</button>
      <button onclick="resetFilters()" class="btn bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-2xl">Réinitialiser</button>
    </div>

    <!-- Create Task Form -->
    <form id="taskForm" class="bg-white p-8 rounded-3xl shadow mb-10">
      <h3 class="text-2xl font-semibold mb-6">Nouvelle Tâche</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <input type="text" id="taskTitle" placeholder="Titre de la tâche" class="px-5 py-4 border rounded-2xl" required>
        <select id="priority" class="px-5 py-4 border rounded-2xl">
          <option value="basse">Basse</option>
          <option value="moyenne" selected>Moyenne</option>
          <option value="haute">Haute</option>
        </select>
      </div>
      <textarea id="taskDescription" rows="3" class="mt-6 w-full px-5 py-4 border rounded-2xl" placeholder="Description..."></textarea>
      <input type="date" id="taskDueDate" class="mt-6 w-full px-5 py-4 border rounded-2xl">
      <button type="submit" class="mt-8 w-full btn bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-semibold">Ajouter la Tâche</button>
    </form>

    <!-- Tasks List -->
    <div id="tasksList" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

    <!-- Activity Feed -->
    <div class="mt-12">
      <h3 class="text-2xl font-semibold mb-6 flex items-center gap-2">
        <i class="fas fa-history text-gray-500"></i> Historique des activités
      </h3>
      <div id="activityFeed" class="space-y-4"></div>
    </div>
  </div>

  <!-- Notification Panel -->
  <div id="notificationPanel" class="hidden fixed top-16 right-6 w-96 bg-white rounded-3xl shadow-2xl p-5 max-h-[70vh] overflow-auto z-50 border">
    <div class="flex justify-between items-center mb-4 border-b pb-3">
      <h3 class="font-semibold text-lg">Notifications</h3>
      <button onclick="toggleNotifications()" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
    </div>
    <div id="notificationsList" class="space-y-3"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/tasks.js"></script>
</body>
</html>
