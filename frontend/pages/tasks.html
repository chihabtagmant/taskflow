<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow — Tâches</title>
</head>
<body>
    <h1>Gestion des Tâches</h1>

    <!-- Formulaire créer une tâche -->
    <form id="taskForm">
        <input type="text" id="title" placeholder="Titre de la tâche" required />
        
        <select id="priority">
            <option value="basse">Basse</option>
            <option value="moyenne">Moyenne</option>
            <option value="haute">Haute</option>
        </select>

        <select id="status">
            <option value="à faire">À faire</option>
            <option value="en cours">En cours</option>
            <option value="terminé">Terminé</option>
        </select>

        <!-- Dropdown membres — Fonctionnalité 4 -->
        <select id="assignedTo">
            <option value="">Assigner à un membre</option>
        </select>

        <button type="submit">Créer la tâche</button>
    </form>
   <input id="searchInput" type="text" placeholder="Rechercher une tâche">

<select id="statusFilter">
  <option value="">Tous les statuts</option>
  <option value="à faire">À faire</option>
  <option value="en cours">En cours</option>
  <option value="terminé">Terminé</option>
</select>

<select id="priorityFilter">
  <option value="">Toutes les priorités</option>
  <option value="basse">Basse</option>
  <option value="moyenne">Moyenne</option>
  <option value="haute">Haute</option>
</select>

<select id="assignedToFilter">
  <option value="">Tous les membres</option>
</select>

<button id="prevPage">Précédent</button>
<span id="pageInfo">Page 1</span>
<button id="nextPage">Suivant</button>
    <!-- Liste des tâches -->
    <div id="tasksList"></div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/tasks.js"></script>
</body>
</html>
