<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Tableau de Bord</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: #007bff;
      color: white;
    }
    .container { max-width: 1000px; margin: 20px auto; }
  </style>
</head>
<body>
  <header>
    <h1>TaskFlow</h1>
    <div>
      <span id="userName"></span> &nbsp;&nbsp;
      <button onclick="logout()">Déconnexion</button>
    </div>
  </header>

  <div class="container">
    <h2>Bienvenue, <span id="welcomeName"></span> !</h2>
    <p id="welcomeMessage"></p>

    <div id="stats">
      <h3>📊 Votre Tableau de Bord</h3>
      <p>Nombre de projets actifs : <strong id="activeProjects">0</strong></p>
      <p>Tâches assignées : <strong id="assignedTasks">0</strong></p>
      <p>Tâches terminées : <strong id="completedTasks">0</strong></p>
    </div>

    <br>
    <a href="projects.html">📋 Voir mes Projets</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
