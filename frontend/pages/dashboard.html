<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Tableau de Bord</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f6f9; }
    header { background: #007bff; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }
    .in-progress { margin-top: 30px; }
  </style>
</head>
<body>
  <header>
    <h1>TaskFlow</h1>
    <div>
      <span id="userName"></span>
      <button onclick="logout()">Déconnexion</button>
    </div>
  </header>

  <div class="container">
    <h2>Tableau de Bord</h2>
    <div class="stats" id="statsContainer"></div>

    <div class="in-progress">
      <h3>Tâches en cours</h3>
      <div id="inProgressTasks"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
