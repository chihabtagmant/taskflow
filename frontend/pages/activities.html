<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Historique des Activités</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    
    .timeline::before {
      content: '';
      position: absolute;
      left: 28px;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(to bottom, #3b82f6, #6366f1);
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <button onclick="window.location.href='projects.html'" class="text-gray-500 hover:text-gray-700">
          <i class="fas fa-arrow-left text-2xl"></i>
        </button>
        <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">TaskFlow</h1>
      </div>
      <div class="flex items-center gap-4">
        <span id="userName" class="font-medium"></span>
        <button onclick="logout()" class="px-5 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-2xl font-medium">Déconnexion</button>
      </div>
    </div>
  </header>

  <div class="max-w-4xl mx-auto px-6 py-10">
    <h2 class="text-4xl font-semibold mb-2">Historique des Activités</h2>
    <p class="text-gray-600 mb-10" id="projectName">Projet en cours de chargement...</p>

    <div id="activityFeed" class="timeline relative pl-16 space-y-8">
      <!-- Filled by JavaScript -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/activities.js"></script>
</body>
</html>
